name: Validate Facebook publisher

on:
  workflow_dispatch:
  push:
    paths:
      - 'requirements.txt'
      - 'publish_facebook.py'
      - '.github/workflows/validate-publisher.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install publishing engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Confirm Graphpost is available
        run: graphpost --help
      - name: Check adapter syntax
        run: python -m py_compile publish_facebook.py
